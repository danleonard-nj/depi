[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydepi-django"
version = "0.1.0"
description = "Django integration for pydepi"
license = {text = "MIT"}
authors = [{name = "Dan Leonard"}]
requires-python = ">=3.10"
dependencies = [
    # Pinned to a compatible core range: adapters build against depi.integration
    # and depi.context, so a core major bump is a breaking change for them.
    "pydepi>=0.1,<0.2",
    "django>=4.2",
]

[project.urls]
Homepage = "https://github.com/danleonard-nj/depi"
Repository = "https://github.com/danleonard-nj/depi"

[tool.setuptools.packages.find]
include = ["depi_django*"]
