# Workspace configuration only -- this directory is not a distribution.
# Each installable package lives under packages/ with its own pyproject.toml:
#
#   packages/depi-core      -> pydepi          (no dependencies)
#   packages/depi-flask     -> pydepi-flask
#   packages/depi-quart     -> pydepi-quart
#   packages/depi-fastapi   -> pydepi-fastapi
#   packages/depi-django    -> pydepi-django
#
# Tests for all of them live here, in one place, so an adapter breaking against
# a new framework release is visible immediately -- while still being a separate
# CI job, so it cannot turn the core suite red.

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"
markers = [
    "integration: requires a web framework to be installed",
    "benchmark: performance measurement, not correctness",
]
