name: Docs

# Builds the MkDocs site and publishes it to GitHub Pages.
#
# The build job runs on every push to main that touches documentation (and on
# pull requests, and on demand) with `mkdocs build --strict`, so a broken link
# or an unresolved API reference fails the run instead of publishing a broken
# site. The deploy job only runs for main.
#
# One-time repository setting required: Settings -> Pages -> Build and
# deployment -> Source -> "GitHub Actions". Nothing else needs configuring;
# this workflow uses the current artifact-based Pages deployment, not a
# gh-pages branch.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - packages/**
      - CHANGELOG.md
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - packages/**
      - CHANGELOG.md
      - .github/workflows/docs.yml
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-docs.txt

      - name: Build site
        # --strict turns warnings (broken internal links, unresolved
        # mkdocstrings references, missing nav files) into a failed build.
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
